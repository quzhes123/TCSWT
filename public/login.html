<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#165DFF">
  <title>登录 · 商务通智能调研</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
      background:
        radial-gradient(1200px 600px at -10% -10%, rgba(22,93,255,.18), transparent 60%),
        radial-gradient(900px 500px at 110% 110%, rgba(0,180,42,.14), transparent 60%),
        linear-gradient(180deg,#f6f8fc 0%, #eef2f9 100%);
      min-height: 100vh;
    }
    .glass {
      background: rgba(255,255,255,.78);
      backdrop-filter: saturate(160%) blur(14px);
      -webkit-backdrop-filter: saturate(160%) blur(14px);
      border: 1px solid rgba(255,255,255,.7);
    }
    .pill { background:#eef3ff; color:#165DFF; font-size:11px; font-weight:600; letter-spacing:.04em; padding:3px 8px; border-radius:999px; }
    .input {
      width:100%; padding:11px 12px 11px 38px; font-size:14px;
      background:#fff; border:1px solid #e3e6ec; border-radius:10px; transition:all .15s;
      outline:none;
    }
    .input:focus { border-color:#165DFF; box-shadow:0 0 0 3px rgba(22,93,255,.12); }
    .btn-primary {
      width:100%; padding:11px 14px; border-radius:10px; font-weight:600; font-size:14px;
      background: linear-gradient(180deg,#1f6dff 0%,#0e51e6 100%);
      color:#fff; box-shadow:0 6px 16px -6px rgba(22,93,255,.55);
      transition:transform .06s, box-shadow .15s;
    }
    .btn-primary:hover { box-shadow:0 8px 22px -6px rgba(22,93,255,.65); }
    .btn-primary:active { transform: translateY(1px); }
    .btn-primary:disabled { opacity:.6; cursor:not-allowed; box-shadow:none; }
    .feature i { color:#165DFF; }
    .err {
      background:#fff1f0; border:1px solid #ffd1cd; color:#c0392b;
      padding:9px 12px; border-radius:8px; font-size:13px; display:flex; gap:8px; align-items:center;
    }
  </style>
</head>
<body class="text-gray-800">
  <main class="min-h-screen flex items-center justify-center px-4 py-10">
    <div class="w-full max-w-5xl grid md:grid-cols-2 gap-10 items-center">

      <!-- 左侧品牌区 -->
      <section class="hidden md:block">
        <div class="flex items-center gap-3 mb-8">
          <div class="w-11 h-11 bg-[#165DFF] rounded-2xl flex items-center justify-center text-white shadow-md">
            <i class="fas fa-magnifying-glass-chart text-lg"></i>
          </div>
          <div>
            <div class="text-lg font-bold text-gray-800">商务通</div>
            <div class="text-xs text-gray-500 -mt-0.5">客户智能调研系统</div>
          </div>
        </div>

        <h1 class="text-3xl font-bold leading-tight tracking-tight text-gray-800">
          客户档案<br/>智能调研与补全
        </h1>
        <p class="mt-3 text-[15px] text-gray-500">
          上传一张表，输出带来源的调研报告。
        </p>
      </section>

      <!-- 右侧登录卡 -->
      <section class="glass shadow-xl rounded-2xl p-7 md:p-9">
        <div class="md:hidden flex items-center gap-3 mb-5">
          <div class="w-10 h-10 bg-[#165DFF] rounded-xl flex items-center justify-center text-white shadow-sm">
            <i class="fas fa-magnifying-glass-chart"></i>
          </div>
          <div>
            <div class="text-[15px] font-bold text-gray-800">商务通</div>
            <div class="text-[11px] text-gray-500 -mt-0.5">客户智能调研系统</div>
          </div>
        </div>

        <h2 class="text-xl font-bold text-gray-800">欢迎登录</h2>
        <p class="text-sm text-gray-500 mt-1">使用您的账号继续</p>

        <form id="loginForm" class="mt-6 space-y-4" autocomplete="on">
          <div id="errBox" class="err hidden">
            <i class="fas fa-circle-exclamation"></i>
            <span id="errMsg">用户名或密码错误</span>
          </div>

          <div>
            <label class="block text-xs font-medium text-gray-500 mb-1.5">用户名</label>
            <div class="relative">
              <i class="fas fa-user absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
              <input id="username" name="username" type="text" required autofocus
                     class="input" placeholder="请输入用户名" autocomplete="username">
            </div>
          </div>

          <div>
            <label class="block text-xs font-medium text-gray-500 mb-1.5">密码</label>
            <div class="relative">
              <i class="fas fa-lock absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
              <input id="password" name="password" type="password" required
                     class="input pr-10" placeholder="请输入密码" autocomplete="current-password">
              <button type="button" id="togglePw"
                      class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 text-sm"
                      aria-label="显示密码">
                <i class="fas fa-eye"></i>
              </button>
            </div>
          </div>

          <div class="flex items-center justify-between text-xs text-gray-500">
            <label class="inline-flex items-center gap-2 select-none cursor-pointer">
              <input id="remember" type="checkbox" class="rounded border-gray-300 text-[#165DFF] focus:ring-[#165DFF]" checked>
              7 天内自动登录
            </label>
            <span class="text-gray-400">忘记密码？联系管理员</span>
          </div>

          <button id="submitBtn" type="submit" class="btn-primary mt-2">
            <span id="btnText"><i class="fas fa-arrow-right-to-bracket mr-1"></i>登录</span>
          </button>
        </form>

        <div class="mt-6 text-[11px] text-gray-400 text-center">
          © 商务通调研系统 · MVP
        </div>
      </section>
    </div>
  </main>

  <script>
    const form = document.getElementById('loginForm');
    const errBox = document.getElementById('errBox');
    const errMsg = document.getElementById('errMsg');
    const btn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const togglePw = document.getElementById('togglePw');
    const pwInput = document.getElementById('password');

    togglePw.addEventListener('click', () => {
      const isPw = pwInput.type === 'password';
      pwInput.type = isPw ? 'text' : 'password';
      togglePw.querySelector('i').className = isPw ? 'fas fa-eye-slash' : 'fas fa-eye';
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errBox.classList.add('hidden');
      btn.disabled = true;
      btnText.innerHTML = '<i class="fas fa-spinner fa-spin mr-1"></i>登录中...';
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value.trim(),
            password: document.getElementById('password').value,
            remember: document.getElementById('remember').checked,
          }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.ok) {
          errMsg.textContent = data.error || '用户名或密码错误';
          errBox.classList.remove('hidden');
          btn.disabled = false;
          btnText.innerHTML = '<i class="fas fa-arrow-right-to-bracket mr-1"></i>登录';
          return;
        }
        const next = new URLSearchParams(location.search).get('next') || '/';
        location.replace(next);
      } catch (err) {
        errMsg.textContent = '网络错误：' + (err?.message || err);
        errBox.classList.remove('hidden');
        btn.disabled = false;
        btnText.innerHTML = '<i class="fas fa-arrow-right-to-bracket mr-1"></i>登录';
      }
    });
  </script>
</body>
</html>
